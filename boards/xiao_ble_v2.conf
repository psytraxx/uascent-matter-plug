# Board Kconfig fragment for a second physical unit ("v2"): same xiao_ble
# target, same GPIO wiring (boards/xiao_ble.overlay -- the retrofit is
# hand-soldered per unit, so the physical wires just land on whatever XIAO
# pins that overlay already assigns; see CLAUDE.md, "Hardware variants"), but
# a different pairing code so this unit can't be confused with a
# default-variant one during commissioning. Build with:
#
#   west build -b xiao_ble -- -DFILE_SUFFIX=v2
#
# See boards/xiao_ble.conf for what this replaces and why this is the only
# thing that differs per variant.

# --- Fixed onboarding credentials ------------------------------------------
# Same passcode as the default variant but a different discriminator, which
# is the standard Matter SDK convention for distinguishing otherwise-
# identical test devices during commissioning (the discriminator alone
# selects which device responds). Change both for anything non-throwaway.
# The firmware prints the authoritative pairing code and QR payload at boot.
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF01
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="XIAOPlugV2"

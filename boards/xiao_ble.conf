# Board Kconfig fragment for the default hardware variant. Zephyr merges
# boards/<BOARD>.conf on top of prj.conf automatically; with
# -DFILE_SUFFIX=<variant>, boards/<BOARD>_<variant>.conf is used instead (see
# boards/xiao_ble_v2.conf for the second wiring variant, and CLAUDE.md /
# docs/smart-plug-plan.md for how to add another one).
#
# This file holds exactly the settings that must differ between two
# otherwise-identical units built from the same source: the onboarding
# credentials and the BLE device name. Everything else common to all
# variants stays in prj.conf.

# --- Fixed onboarding credentials ------------------------------------------
# Compiled into the image so the pairing code is fixed and known in advance
# rather than being read off the serial console. Factory data is disabled on
# this board, so these Kconfig values are what the stack actually uses.
#   passcode 20202021 + discriminator 0xF00 (manual pairing code 3497-011-2332)
# These are the Matter test defaults; change both for anything non-throwaway.
# The firmware prints the authoritative pairing code and QR payload at boot.
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF00
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="XIAOPlug"

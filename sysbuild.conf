SB_CONFIG_MATTER=y

# Sysbuild force-writes CONFIG_CHIP_OTA_REQUESTOR into the application config
# (nrf/sysbuild/CMakeLists.txt), and that write lands after prj.conf and the
# application Kconfig, so it can only be turned off from here. The OTA
# requestor needs the MCUboot slot0_partition this board's UF2 flash map does
# not define.
SB_CONFIG_MATTER_OTA=n
SB_CONFIG_PARTITION_MANAGER=n

# The XIAO ships the Adafruit UF2 bootloader and its flash map has no MCUboot
# slot0_partition, so MCUboot cannot be built for this board.
SB_CONFIG_BOOTLOADER_NONE=y

<rect width="980" height="642" rx="10" fill="#fbfbf9"/>
<text x="28" y="40" font-size="19" font-weight="700" fill="#111">Plug board  →  UAM023 11-pad footprint  →  XIAO nRF52840</text>
<text x="28" y="62" font-size="13" fill="#666">Pads in physical order. Odd pins sit on the module’s bottom face, even pins on the top face.</text>
<rect x="28" y="78" width="924" height="26" rx="5" fill="#fdeaea" stroke="#c0392b"/>
<text x="42" y="96" font-size="12.5" font-weight="600" fill="#991b1b">⚠  The whole plug side is mains-referenced. The BL0937 provides no isolation, so every pad here can sit at mains potential.</text>

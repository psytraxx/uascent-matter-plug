CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_GPIO=y

# The board's devicetree already routes the console to USB CDC-ACM (see
# cdc_acm_serial.dtsi included by xiao_ble_common.dtsi) using the usb_device_next
# stack, so no USB Kconfig is needed here. Enabling the legacy USB_DEVICE_STACK
# on top of it produces duplicate cdc_acm symbols at link time.
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# Wait for the USB console to be opened before logging, so the startup lines
# are not lost while the host enumerates the port.
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_LOG_BUFFER_SIZE=2048

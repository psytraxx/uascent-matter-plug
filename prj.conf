# ---------------------------------------------------------------------------
# Matter light switch for the XIAO nRF52840 Sense.
# Ported from the NCS samples/matter/light_switch sample; the deltas from that
# sample are the board constraints (no MCUboot, no factory data) and the fixed
# onboarding credentials below.
# ---------------------------------------------------------------------------

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="XIAO Light Switch"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/light_switch.zap"

# 32772 == 0x8004 (example light-switch-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32772
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# --- Fixed onboarding credentials ------------------------------------------
# Compiled into the image so the pairing code is fixed and known in advance
# rather than being read off the serial console. Factory data is disabled on
# this board, so these Kconfig values are what the stack actually uses.
#   passcode 20202021 + discriminator 0xF00 (manual pairing code 3497-011-2332)
# These are the Matter test defaults; change both for anything non-throwaway.
# The firmware prints the authoritative pairing code and QR payload at boot.
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF00
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021

# LEDs and buttons: the XIAO has an RGB LED and no on-board user button, so
# the DK library drives the devicetree nodes from boards/*.overlay.
CONFIG_DK_LIBRARY=y
CONFIG_GPIO=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="XIAOSwitch"

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
# The light_switch sample enables the Matter shell, but that assumes a UART
# separate from the log backend. This board has a single USB CDC-ACM console,
# so the shell prompt races the log output and corrupts both. Left off.
CONFIG_CHIP_LIB_SHELL=n
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# --- Console ---------------------------------------------------------------
# The board devicetree already routes the console to USB CDC-ACM using the
# usb_device_next stack, so no USB Kconfig belongs here. Enabling the legacy
# USB_DEVICE_STACK on top of it yields duplicate cdc_acm symbols at link time.
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
# LOG_MODE_MINIMAL (the default here) drops messages instead of buffering
# them, which truncated the onboarding-code block during the boot burst.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
# The whole Matter boot burst is emitted within ~70 ms, but the log thread
# holds off draining for LOG_PROCESS_THREAD_STARTUP_DELAY_MS (4 s by default)
# to let USB CDC-ACM enumerate. With only 4 KB of buffer that overflows and
# LOG_MODE_OVERFLOW silently discards the oldest entries -- which is exactly
# where the onboarding-code block sits. Keep the enumeration delay, but make
# the buffer big enough to hold the burst until the thread starts.
CONFIG_LOG_BUFFER_SIZE=16384
# Block the emitting thread instead of dropping messages if the buffer ever
# does fill, so the log stays complete rather than losing the oldest lines.
CONFIG_LOG_BLOCK_IN_THREAD=y
# The UART backend defaults to a 1-byte buffer, so it hands the console a
# character at a time. Once the log buffer above let the whole boot burst
# through at once, that outpaced the CDC-ACM endpoint and lines were spliced
# into each other mid-character. Buffer whole messages instead.
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=256

# --- Board constraints -----------------------------------------------------
# No factory data partition in the UF2 flash map. CHIP_FACTORY_DATA is reached
# through a choice, so it is disabled by selecting the NONE branch rather than
# by assigning it =n.
CONFIG_CHIP_FACTORY_DATA_NONE=y

# No MCUboot: the Adafruit UF2 bootloader owns the flash map and defines no
# slot0_partition, so the DFU/image-manager stack cannot be built.
#
# CHIP_BOOTLOADER is a choice whose MCUBOOT branch hard-"select"s IMG_MANAGER,
# and a select cannot be overridden by assigning =n, so the NONE branch is
# picked instead -- the same pattern as CHIP_FACTORY_DATA_NONE above.
# CHIP_OTA_REQUESTOR itself is not set here: sysbuild force-writes it after
# this file is merged, so it is disabled via SB_CONFIG_MATTER_OTA=n in
# sysbuild.conf instead.
CONFIG_CHIP_BOOTLOADER_NONE=y

# Nothing selects these once the MCUboot branch is deselected, so they can be
# switched off directly. This keeps flash_img.c (which resolves
# slot0_partition at compile time) out of the build.
CONFIG_IMG_MANAGER=n
CONFIG_MCUBOOT_IMG_MANAGER=n
CONFIG_DFU_TARGET=n
CONFIG_DFU_MULTI_IMAGE=n
CONFIG_STREAM_FLASH=n

# NFC onboarding is not wired up on this board.
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# Keep the image inside the 0xC5000 app partition.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
